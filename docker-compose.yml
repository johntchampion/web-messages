services:
  service:
    image: node:24-alpine
    container_name: web-messages-service
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=8000
      - TOKEN_SECRET=${TOKEN_SECRET:-local-development-secret}
      - APP_BASE_URL=http://localhost:${PWA_PORT:-3000}
      - BASE_URL=http://localhost:${SERVICE_PORT:-8000}
      - APP_NAME=${APP_NAME:-OneTimeChat}
      - VERIFY_USERS=${VERIFY_USERS:-false}
      - SEND_EMAILS=${SEND_EMAILS:-false}
      - ENABLE_UPLOADS=${ENABLE_UPLOADS:-false}
      - MAILJET_API_KEY=${MAILJET_API_KEY:-}
      - MAILJET_API_SECRET=${MAILJET_API_SECRET:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - NODE_ENV=${NODE_ENV:-test}
    ports:
      - "${SERVICE_PORT:-8000}:8000"
    volumes:
      - ./web-messages-service:/app
      - service_node_modules:/app/node_modules

  pwa:
    image: node:24-alpine
    container_name: web-messages-pwa
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=3000
      - BACKEND_URL=http://service:8000
      - VITE_APP_NAME=${APP_NAME:-OneTimeChat}
    ports:
      - "${PWA_PORT:-3000}:3000"
    volumes:
      - ./web-messages-pwa:/app
      - pwa_node_modules:/app/node_modules
    depends_on:
      - service

volumes:
  service_node_modules:
  pwa_node_modules:
